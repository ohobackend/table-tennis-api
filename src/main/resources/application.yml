spring:
  application:
    name: table-tennis-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/table_tennis}
    username: ${SPRING_DATASOURCE_USERNAME:tt_user}
    password: ${SPRING_DATASOURCE_PASSWORD:tt_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
jwt:
  secret: ${JWT_SECRET}
  access-seconds: 3600
  refresh-seconds: 1209600
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
match:
  sets-to-win: ${MATCH_SETS_TO_WIN:3}
management:
  endpoints:
    web:
      exposure:
        include: health
server:
  error:
    include-message: never
