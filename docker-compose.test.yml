services:
  test-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: table_tennis_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d table_tennis_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  tests:
    image: gradle:8.14.3-jdk17
    working_dir: /app
    volumes:
      - .:/app
      - test_gradle_cache:/home/gradle/.gradle
    environment:
      TEST_DATABASE_URL: jdbc:postgresql://test-postgres:5432/table_tennis_test
      TEST_DATABASE_USERNAME: test
      TEST_DATABASE_PASSWORD: test
    depends_on:
      test-postgres:
        condition: service_healthy
    command: ["gradle", "test", "bootJar", "wrapper", "--gradle-version", "8.14.3", "--no-daemon"]
volumes:
  test_gradle_cache:
